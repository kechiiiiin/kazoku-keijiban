name: kazoku-keijiban

# 家族掲示板（設計: jinsei vault hestia/projects/家族掲示板設計.md）
# `*.xcodeproj` は生成物でコミットしない。必ず `xcodegen generate`（make generate）が先

options:
  bundleIdPrefix: jp.kechiiiiin
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"

# Release だけ Secrets.xcconfig（make archive が生成・gitignore）を読む。無ければ空のまま
configFiles:
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    # 有料チーム（Apple Developer Program）の Team ID。環境変数 KAZOKU_TEAM_ID から入れる
    # （Makefile が ~/.config/kazoku-keijiban/team-id を読む。秘密ではないので分かったら直書きしてよい）。
    # ⚠️ 無料の Personal Team は入れない（App Group・プッシュ・TestFlight が使えない）
    DEVELOPMENT_TEAM: "${KAZOKU_TEAM_ID}"
    # Worker の URL（秘密ではない）
    KAZOKU_SERVER_URL: "https://kazoku-keijiban.kechiiiiin.com"
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production

targets:
  KazokuKeijiban:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: KazokuKeijiban
        PRODUCT_BUNDLE_IDENTIFIER: jp.kechiiiiin.kazoku-keijiban
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: KazokuKeijibanWidget

  KazokuKeijibanWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: KazokuKeijibanWidget
        PRODUCT_BUNDLE_IDENTIFIER: jp.kechiiiiin.kazoku-keijiban.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  KazokuKeijiban:
    build:
      targets:
        KazokuKeijiban: all
        KazokuKeijibanWidget: all
    run:
      config: Debug
    archive:
      config: Release
